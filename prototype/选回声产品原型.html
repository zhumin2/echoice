<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>选回声 · 可交互产品原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='10' cy='16' r='8' fill='%23FF7A3D'/%3E%3Ccircle cx='22' cy='16' r='8' fill='%232F5CFF'/%3E%3C/svg%3E">
<style>
:root{
  --o:#FF7A3D;--b:#2F5CFF;--ob2:#FF9A6B;--bb2:#7A9AFF;
  --ink:#20242C;--sub:#787E8A;--faint:#B4B8C0;
  --bg:#F5F2EB;--card:#FFFFFF;--line:#EAE6DC;--ok:#18A05E;--danger:#E5484D;
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;color:var(--ink);background:
  radial-gradient(1200px 600px at 15% -10%, #FFE9DC 0%, transparent 60%),
  radial-gradient(1000px 500px at 110% 110%, #E4EBFF 0%, transparent 55%),
  #EFECE4;}
.stage{display:flex;gap:56px;align-items:center;justify-content:center;min-height:100vh;padding:36px 24px}
/* 左侧说明板 */
.deck{max-width:360px;color:#3A3F49}
.deck .logo{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:800;letter-spacing:1px}
.deck .logo .dot{width:22px;height:22px;border-radius:50%}
.deck h2{font-size:26px;line-height:1.4;margin:26px 0 12px;font-weight:800}
.deck p{font-size:14px;line-height:1.8;color:#5C6270}
.deck .steps{margin-top:22px;border-top:1px dashed #C9C4B6;padding-top:18px}
.deck .steps b{display:inline-block;background:#20242C;color:#fff;border-radius:8px;padding:2px 10px;font-size:12px;margin-right:8px}
.deck .steps div{margin:10px 0;font-size:13px;color:#4A4F5A;line-height:1.6}
.deck .tag{display:inline-block;margin-top:20px;font-size:12px;color:#8A6D3F;background:#F7ECD2;border:1px solid #EAD9AC;padding:6px 12px;border-radius:999px}
/* 手机框架 */
.phone{width:390px;height:844px;border-radius:46px;background:#101215;padding:10px;box-shadow:0 30px 80px rgba(32,36,44,.28),0 8px 24px rgba(32,36,44,.16);position:relative;flex-shrink:0}
.screen{width:100%;height:100%;background:var(--bg);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.statusbar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;flex-shrink:0;color:var(--ink);background:var(--bg)}
.statusbar svg{display:block}
.app{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.app::-webkit-scrollbar{display:none}
/* 通用 */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 6px;position:sticky;top:0;background:var(--bg);z-index:5}
.topbar .t{font-size:18px;font-weight:800}
.topbar .icons{display:flex;gap:16px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:none;cursor:pointer;box-shadow:0 2px 6px rgba(32,36,44,.06)}
.icon-btn svg{width:20px;height:20px}
.pad{padding:0 16px}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 3px 14px rgba(32,36,44,.05);border:1px solid var(--line)}
.muted{color:var(--sub);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600}
.pill.o{background:#FFF0E6;color:#C14A10}.pill.b{background:#E9EEFF;color:#2745B8}.pill.g{background:#E6F6EE;color:#0E7A4A}.pill.gy{background:#F0F0F2;color:#5A5F68}.pill.dp{background:#F3E8FF;color:#7A2BC0}
/* 首页 */
.greet{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 12px}
.greet .g b{font-size:17px;display:block}
.greet .g span{font-size:12px;color:var(--sub)}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.daily{margin:4px 16px 12px;display:flex;align-items:center;gap:10px;background:linear-gradient(100deg,#FFF3EA,#F6F0FF);border:1px solid #F0E2D6;border-radius:16px;padding:12px 14px;cursor:pointer}
.daily .ic{width:36px;height:36px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.daily b{font-size:14px;display:block}
.daily span{font-size:11px;color:var(--sub)}
.poll-card{margin:0 16px 12px;cursor:pointer;transition:transform .15s}
.poll-card:active{transform:scale(.98)}
.poll-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.poll-head .nm{font-size:14px;font-weight:700}
.poll-head .tm{font-size:11px;color:var(--faint);margin-top:2px}
.poll-title{font-size:15px;font-weight:700;margin-bottom:10px;line-height:1.4}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/5;cursor:pointer}
.opt img{width:100%;height:100%;object-fit:cover;display:block}
.opt .lab{position:absolute;left:8px;bottom:8px;right:8px;display:flex;align-items:center;gap:6px}
.opt .lab .key{width:22px;height:22px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.opt .lab .tx{background:rgba(20,22,28,.62);color:#fff;font-size:11px;padding:3px 8px;border-radius:8px;backdrop-filter:blur(4px)}
.opt .bub{position:absolute;top:8px;right:8px;background:rgba(20,22,28,.55);color:#fff;font-size:10px;padding:2px 7px;border-radius:999px;backdrop-filter:blur(4px)}
.key-a{background:var(--o)}.key-b{background:var(--b)}.key-c{background:#8A63E8}.key-d{background:#12A594}
.poll-foot{display:flex;align-items:center;gap:14px;margin-top:11px;font-size:12px;color:var(--sub)}
.poll-foot .bar{flex:1;height:6px;border-radius:99px;background:#F0EDE5;overflow:hidden;display:flex}
.poll-foot .bar i{display:block;height:100%}
.mini-btn{margin-left:auto;font-size:12px;color:#fff;background:var(--ink);border:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600}
/* tabbar */
.tabbar{height:62px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;flex-shrink:0;padding-bottom:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;color:var(--faint);font-size:10px;width:56px;padding:6px 0}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink);font-weight:700}
.tab-mid{width:44px;height:44px;border-radius:16px;background:var(--ink);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 16px rgba(32,36,44,.25);margin-top:-12px}
.tab-mid svg{width:22px;height:22px}
.homeind{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:99px;background:#D5D9E0}
/* 详情页 */
.detail{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;overflow-y:auto}
.detail-top{display:flex;align-items:center;gap:10px;padding:8px 14px}
.detail-top .nm{font-size:14px;font-weight:700}
.detail-top .tm{font-size:11px;color:var(--faint)}
.stage-img{position:relative;margin:0 14px;border-radius:20px;overflow:hidden;flex:1;min-height:0;background:#1A1D24}
.stage-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:opacity .25s}
.stage-img .ctl{position:absolute;left:12px;bottom:12px;display:flex;gap:8px}
.stage-img .ctl button{border:1px solid rgba(255,255,255,.4);background:rgba(20,22,28,.5);color:#fff;padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer;backdrop-filter:blur(4px)}
.stage-img .ctl button.on{background:#fff;color:var(--ink);border-color:#fff;font-weight:700}
.rail{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;gap:16px;align-items:center}
.rail button{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;font-size:10px}
.rail .rb{width:42px;height:42px;border-radius:50%;background:rgba(20,22,28,.45);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.rail svg{width:20px;height:20px}
.detail-body{padding:12px 16px 8px;display:flex;flex-direction:column;gap:10px}
.q-title{font-size:17px;font-weight:800;line-height:1.4}
.vote-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vote-btn{display:flex;align-items:center;gap:8px;padding:13px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:700;transition:all .18s;position:relative;overflow:hidden}
.vote-btn .k{width:26px;height:26px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.vote-btn .pct{margin-left:auto;font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap}
.vote-btn .fill{position:absolute;inset:0;opacity:.12;transition:width .6s ease;border-radius:0}
.vote-btn.voted{border-color:transparent;background:#fff;box-shadow:0 4px 14px rgba(32,36,44,.10)}
.vote-btn.done{cursor:default}
.same-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);padding:2px 2px 0}
.same-line b{color:var(--ok)}
.cmt-input{display:flex;gap:10px;align-items:center;padding:10px 0 4px}
.cmt-input input{flex:1;height:40px;border:1px solid var(--line);border-radius:999px;padding:0 16px;font-size:13px;background:#fff;outline:none}
.cmt-input .send{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cmt-input .mic{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cmt-list{display:flex;flex-direction:column;gap:10px;max-height:0;overflow:hidden;transition:max-height .4s ease}
.cmt-list.open{max-height:260px;overflow-y:auto}
.cmt{display:flex;gap:8px;align-items:flex-start;background:#fff;border-radius:14px;padding:9px 11px;border:1px solid var(--line)}
.cmt .c-body{font-size:12.5px;line-height:1.5;color:#3A3F49}
.cmt .c-body b{font-size:12px;display:block;color:var(--sub);margin-bottom:2px}
.settle-btn{display:block;width:100%;background:var(--ink);color:#fff;border:none;border-radius:16px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}
/* 结果/回音 */
.hero-num{display:flex;gap:0;align-items:center;border-radius:20px;overflow:hidden;height:14px;margin:6px 0 4px}
.hero-num i{height:100%}
.result-card{margin:12px 16px}
.big-num{font-size:34px;font-weight:800;line-height:1}
.sec-t{font-size:13px;font-weight:800;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.echo-preview{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#fff}
.echo-preview .ep-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.echo-preview .ep-body{position:relative;height:210px}
.echo-preview .ep-body img{width:100%;height:100%;object-fit:cover;display:block}
.echo-preview .ep-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:12px;color:var(--sub)}
.echo-card{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(120deg,var(--o),var(--b));margin:12px 16px}
.echo-card .big{font-size:16px;font-weight:800;line-height:1.5;color:#fff;margin-bottom:8px}
.echo-card .sub{font-size:12px;color:rgba(255,255,255,.85);line-height:1.6}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);cursor:pointer;color:#3A3F49}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
/* 抛题 */
.stepper{display:flex;gap:8px;padding:10px 16px 4px}
.step{flex:1;height:5px;border-radius:99px;background:var(--line)}
.step.on{background:var(--ink)}
.step.done{background:var(--o)}
.form-sec{padding:6px 16px}
.form-label{font-size:13px;font-weight:700;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pick{border-radius:12px;overflow:hidden;aspect-ratio:1;border:2.5px solid transparent;cursor:pointer;position:relative}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
.pick.sel{border-color:var(--o)}
.pick .no{position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:7px;background:rgba(20,22,28,.6);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.assign{display:flex;gap:10px;margin-top:10px}
.assign .a-opt{flex:1;border-radius:14px;padding:10px;background:#fff;border:1.5px solid var(--line);text-align:center}
.assign .a-opt img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
.assign .a-opt .k{font-size:12px;font-weight:800}
.opt-name{flex:1;height:38px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:13px;background:#fff;outline:none;min-width:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font-size:12.5px;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:#3A3F49}
.seg button.sel{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.switch-row .tx b{font-size:14px;display:block}
.switch-row .tx span{font-size:11px;color:var(--sub)}
.sw{width:46px;height:26px;border-radius:99px;background:#D9DCE2;border:none;cursor:pointer;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.pub-btn{display:block;width:calc(100% - 32px);margin:16px;background:var(--ink);color:#fff;border:none;border-radius:16px;padding:15px;font-size:15px;font-weight:800;cursor:pointer}
/* 我的 */
.me-hero{display:flex;align-items:center;gap:14px;padding:16px}
.me-hero .nm{font-size:19px;font-weight:800}
.me-hero .id{font-size:12px;color:var(--sub);margin-top:3px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:4px 16px 8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 4px;text-align:center}
.stat b{font-size:18px;display:block}
.stat span{font-size:10.5px;color:var(--sub)}
.persona{margin:8px 16px;display:flex;gap:10px;align-items:center;background:linear-gradient(120deg,#FFF3EA,#EEF1FF);border-radius:18px;padding:14px}
.persona .p-ic{width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.07)}
.persona b{font-size:15px;display:block}
.persona span{font-size:11.5px;color:#5C6270;line-height:1.5;display:block;margin-top:2px}
.list-item{display:flex;align-items:center;gap:11px;padding:13px 16px;background:#fff;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:first-child{border-radius:16px 16px 0 0}
.list-item:last-child{border-radius:0 0 16px 16px;border-bottom:none}
.list-item .t{font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-card{padding:18px 16px}
.map-card svg{width:100%;height:auto;display:block}
.map-note{font-size:11px;color:var(--faint);margin-top:10px;text-align:center}
/* toast */
.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(28,30,38,.94);color:#fff;font-size:13px;padding:11px 20px;border-radius:999px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:85%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
/* 响应式 */
@media (max-width:520px){
  .stage{padding:0;gap:0;min-height:100vh}
  .deck{display:none}
  .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none;padding:0}
  .screen{border-radius:0}
}
</style>
</head>
<body>
<div style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <img src="assets/luosifen.jpg" alt=""><img src="assets/salad.jpg" alt=""><img src="assets/hoodie.jpg" alt=""><img src="assets/knit.jpg" alt=""><img src="assets/dog.jpg" alt=""><img src="assets/cat.jpg" alt=""><img src="assets/tower.jpg" alt=""><img src="assets/startup.jpg" alt="">
</div>
<div class="stage">
  <aside class="deck">
    <div class="logo"><span class="dot" style="background:var(--o)"></span><span class="dot" style="background:var(--b)"></span>选回声</div>
    <h2>选不出来？抛给朋友。</h2>
    <p>面向选择困难症的轻社交 App 可交互原型。橙色 = 选项 A，蓝色 = 选项 B，两者对撞就是本产品的视觉符号。</p>
    <div class="steps">
      <div><b>01</b>首页点任意卡片，帮朋友投一票</div>
      <div><b>02</b>点下方加号，发布你自己的选择题</div>
      <div><b>03</b>打开自己发布的题，落槌并发出回音</div>
      <div><b>04</b>「我的」页查看选择人格与帮选战绩</div>
    </div>
    <div class="tag">示例素材均来自公开搜索，仅作原型占位</div>
  </aside>
  <div class="phone">
    <div class="screen">
      <div class="statusbar">
        <span>9:41</span>
        <svg width="70" height="14" viewBox="0 0 70 14" fill="none"><rect x="0" y="2.5" width="42" height="9" rx="2.5" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="2" y="4.5" width="30" height="5" rx="1" fill="currentColor"/><path d="M47 4.2c1.6 1 1.6 4.6 0 5.6M52 2.6c3.2 2 3.2 6.8 0 8.8M57 1c4.8 3 4.8 9 0 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="64" cy="7" r="3.4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </div>
      <main class="app" id="app"></main>
      <nav class="tabbar" id="tabbar">
        <button class="tab" data-tab="#home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg>首页</button>
        <button class="tab" data-tab="#square"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>广场</button>
        <button class="tab-mid" data-tab="#create"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="tab" data-tab="#messages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16v11H9l-5 4z"/></svg>消息</button>
        <button class="tab" data-tab="#me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.5-3.4 4.3-5 7.5-5s6 1.6 7.5 5"/></svg>我的</button>
      </nav>
      <div class="homeind"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
/* ============ 数据 ============ */
const A={luosifen:'assets/luosifen.jpg',salad:'assets/salad.jpg',hoodie:'assets/hoodie.jpg',knit:'assets/knit.jpg',dog:'assets/dog.jpg',cat:'assets/cat.jpg',tower:'assets/tower.jpg',startup:'assets/startup.jpg'};

/* ============ 工具 ============ */
function fmtV(p){return Object.values(p.votes).reduce((a,b)=>a+b,0)}
function pct(p,k){const t=fmtV(p);return t?Math.round(p.votes[k]/t*100):0}
function voteKey(k){return k==='A'?'key-a':k==='B'?'key-b':k==='C'?'key-c':'key-d'}
function avatar(n,c,sz){return `<div class="avatar" style="background:${c||'#333'};width:${sz||40}px;height:${sz||40}px;font-size:${sz?sz*.37:15}px">${n.slice(0,1)}</div>`}
function pollById(id){return S.polls.find(p=>p.id===id)}
function isMine(id){return S.mine.includes(id)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(S.toasts);S.toasts=setTimeout(()=>t.classList.remove('show'),1800)}
function go(h){location.hash=h}
function statusPill(p){
  if(p.status==='settled')return `<span class="pill g">已落槌${p.echoed?'· 已回音':''}</span>`;
  if(isMine(p.id))return `<span class="pill o">我的题 · 待落槌</span>`;
  return `<span class="pill gy">投票中 · ${p.deadline}</span>`;
}

  return `
  <div class="detail">

      <div class="form-label">截止时间</div>

        ${[['1h','1 小时'],['6h','6 小时'],['24h','24 小时'],['0','不截止']].map(d=>`<button class="${(S.csDead||'24h')===d[0]?'sel':''}" onclick="setDead('${d[0]}')">${d[1]}</button>`).join('')}
      </div>
      <div class="switch-row">
        <div class="tx"><b>盲选模式</b><span>朋友看不到题目，只看画面凭直觉选</span></div>
        <button class="sw ${S.csBlind?'on':''}" onclick="S.csBlind=!S.csBlind;render()" aria-label="盲选开关"></button>
      </div>
      <div class="switch-row" style="border-bottom:none">
        <div class="tx"><b>深度模式（P1）</b><span>重决策场景：仅限指定好友，支持语音回复</span></div>
        <button class="sw ${S.csDeep?'on':''}" onclick="S.csDeep=!S.csDeep;render()" aria-label="深度模式开关"></button>
      </div>
      <button class="pub-btn" style="margin:18px 0" onclick="publish()">发布这道题</button>
    </div>`;
  return `
  <div class="topbar">
    <button class="icon-btn" onclick="${step>1?'prevStep()':'go(\'#home\')'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>

  <div class="stepper">${[1,2,3].map(i=>`<div class="step ${i<step?'done':i===step?'on':''}"></div>`).join('')}</div>
  ${body}`;
}

/* ============ 交互 ============ */
function render(){
  const h=location.hash||'#home';
  const tab=h==='#create'?'#create':h;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(h.startsWith('#feed/')){$app.innerHTML=vFeed(h.split('/')[1]);return}
  if(h.startsWith('#result/')){$app.innerHTML=vResult(h.split('/')[1]);return}
  if(h.startsWith('#echo/')){$app.innerHTML=vEcho(h.split('/')[1]);return}
  const views={'#home':vHome,'#square':vSquare,'#create':vCreate,'#messages':vMessages,'#me':vMe,'#map':vMap};
  $app.innerHTML=(views[h]||views['#home'])();
}
function switchStage(id,key){const p=pollById(id);const o=p.opts.find(x=>x.key===key);const img=document.getElementById('stageImg');if(img){img.src=A[o.img];document.querySelectorAll('#stageCtl button').forEach(b=>b.classList.toggle('on',b.dataset.k===key))}}
function switchEchoImg(id,key){const p=pollById(id);const o=p.opts.find(x=>x.key===key);const img=document.getElementById('echoImg');if(img)img.src=A[o.img]}
function vote(id,key){const p=pollById(id);if(p.status==='settled'||S.voted[id])return;S.voted[id]=key;p.votes[key]=(p.votes[key]||0)+1;p.total=fmtV(p);
  const btn=event.target.closest('.vote-btn');if(btn){btn.classList.add('voted');const f=btn.querySelector('.fill');f.style.width=pct(p,key)+'%'}
  const sl=document.getElementById('sameLine');const c=Math.max(0,p.votes[key]-1);
  if(sl)sl.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="var(--ok)"><path d="M12 2 15 9l7 .5-5.3 4.6L18.6 21 12 17 5.4 21l1.9-6.9L2 9.5 9 9z"/></svg>你和 <b>${c} 位朋友</b>选了同一项${c>=2?'，英雄所见略同':''}`;
  toast(`已帮 ${p.author} 选了 ${key}（匿名）`);
  setTimeout(()=>{if((location.hash||'').startsWith('#feed/'))render()},700);
}
function voteDaily(key){S.voted.daily=key;toast('已参与每日一题');document.querySelectorAll('.vote-btn').forEach(b=>{b.classList.add('done')});}
function addCmt(id){const p=pollById(id);const inp=document.getElementById('cmtBox');const v=inp?inp.value.trim():'';if(!v)return toast('先写句建议吧');p.comments=p.comments||[];p.comments.push({u:ME.name,t:v});inp.value='';render();toast('评论已发出（实名）');const l=document.querySelector('.cmt-list');if(l){l.classList.add('open');setTimeout(()=>l.scrollTop=l.scrollHeight,50)}}
function settle(id,key){const p=pollById(id);p.picked=key;p.status='settled';go('#echo/'+id)}
function publishEcho(id){const p=pollById(id);const t=document.getElementById('echoText');p.echoText=t?t.value.trim()||'':'';p.echoed=true;toast('回音已发布，好友已收到结果');setTimeout(()=>go('#feed/'+id),900)}
/* 抛题流程 */
function togglePick(k){S.cs=S.cs||1;S.csSel=S.csSel||[];const i=S.csSel.indexOf(k);if(i>-1)S.csSel.splice(i,1);else if(S.csSel.length<4)S.csSel.push(k);render()}
function nextStep(n){if(n===2&&S.csSel&&S.csSel.length>=2){S.csAssign={A:S.csSel[0],B:S.csSel[1]}}S.cs=n;render()}
function prevStep(){S.cs=Math.max(1,(S.cs||1)-1);render()}
function setName(k,v){S.csNames=S.csNames||{};S.csNames[k]=v}
function setScope(s){S.csScope=s;if(s!=='spec')S.csSpec=[];render()}
function toggleSpec(n){S.csSpec=S.csSpec||[];const i=S.csSpec.indexOf(n);if(i>-1)S.csSpec.splice(i,1);else S.csSpec.push(n);render()}
function setDead(d){S.csDead=d;render()}
function publish(){
  const a=S.csAssign||{A:null,B:null};
  if(!a.A||!a.B)return toast('请先分配选项 A/B');
  const nameA=(S.csNames&&S.csNames.A)||PICK_LIST.find(x=>x.k===a.A)?.n||'选项 A';
  const nameB=(S.csNames&&S.csNames.B)||PICK_LIST.find(x=>x.k===a.B)?.n||'选项 B';
  const id='p'+Date.now();
  const p={id,author:ME.name,time:'刚刚',title:S.csTitle||'帮我选一下？',mode:S.csDeep?'deep':'normal',scope:S.csScope==='spec'?`指定 ${(S.csSpec||[]).length} 位好友`:(S.csScope==='public'?'公开广场':'全部好友'),deadline:S.csDead==='0'?'不截止':(S.csDead==='1h'?'剩 1 小时':S.csDead==='6h'?'剩 6 小时':'剩 24 小时'),
    opts:[{key:'A',label:nameA,img:a.A},{key:'B',label:nameB,img:a.B}],votes:{A:0,B:0},total:0,status:'voting',picked:null,echoed:false,comments:[]};
  S.polls.unshift(p);S.mine.unshift(id);S.cs=null;S.csSel=null;S.csAssign=null;S.csNames=null;S.csScope=null;S.csDead=null;S.csBlind=false;S.csDeep=false;
  toast('已发布，快去落槌收结果吧');go('#feed/'+id);
}
/* 路由 */
window.addEventListener('hashchange',render);
document.querySelectorAll('.tab,.tab-mid').forEach(b=>b.addEventListener('click',()=>{go(b.dataset.tab);render()}));
render();
</script>
